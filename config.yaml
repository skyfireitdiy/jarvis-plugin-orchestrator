---
id: orchestrator
name: 通用编排器
description: >-
  通用编排器（generic engine）——与领域无关的批量任务执行引擎。
  输入 plan（unit 清单，每个 unit 自带完整提示词或 shell 命令），
  按 DAG 依赖排序、并发限流（concurrency_key/limit）、batch_group 打包、
  超时/熔断/失败留痕，输出 result（每个 unit 的执行结果）。
  通过 orchestrator CLI 命令使用（validate/dry_run/run/show 四动作）。
  用户说「编排」「批量派发任务」「按 plan 执行」「orchestrator」时使用。
  硬依赖：tmux（并发 pane 派发）；uv（安装 CLI）；Python>=3.10，仅标准库。
version: 1.0.0
license: MIT
logo: frontend/icon.svg
# --- 扩展点（路径用 {{plugin_dir}} 占位，运行时渲染为插件绝对路径）---
rules_load_dirs:
  - "{{plugin_dir}}/rules"
# --- 生命周期钩子：安装后检测依赖并用 uv 安装 CLI ---
hooks:
  post-install:
    - "bash scripts/install.sh"
# --- 自定义能力清单（前端展示用）---
capabilities:
  - name: "通用编排 CLI"
    description: >-
      orchestrator 命令：validate/dry_run/run/show 四个动作，按 plan 派发 unit。
      双模式：unit 带 task_desc 时派发 Jarvis Agent（jvs --task-file，Agent 完成后
      写 status 文件）；unit 带 command 时在 tmux pane 直接执行 shell 命令。
      支持 DAG 依赖、限流、batch 打包、超时、熔断、stage 防串台。
      由安装 hook（scripts/install.sh）用 uv 安装，依赖 tmux + uv + jvs。
  - name: "通用编排规则"
    description: >-
      rules/orchestrator.md：指导 Agent 何时用 orchestrator CLI、plan 格式
      与 run 约定（Agent 模式 task_desc → jvs Agent / shell 模式 command）。
