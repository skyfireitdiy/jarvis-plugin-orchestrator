[project]
name = "orchestrator"
version = "1.0.0"
description = "通用编排器（generic engine）——与领域无关的批量任务执行引擎"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
orchestrator = "generic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generic"]
